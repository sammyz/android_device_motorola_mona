name: Verify published TWRP Android 16 artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify tested image and source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat builds/android16-test1/image.part-* > twrp-mona-android16-test1.img
          test "$(stat -c %s twrp-mona-android16-test1.img)" = 45465600
          echo "6d4bdc0a416721f1b5fee763181a3b50c6094f9e09dfda118432c83668b78770  twrp-mona-android16-test1.img" | sha256sum --check
          echo "170052f703d9f0da0b889c1596ff9b369daa83755f0cb1b8f0c74590efc2eb4d  builds/android16-test1/source.bundle" | sha256sum --check
